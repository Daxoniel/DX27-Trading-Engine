name: Sentinel final research report

on:
  pull_request:
    paths:
      - "src/dx27/adapters/sentinel/**"
      - "tests/unit/test_sentinel_*research*.py"
      - "tests/unit/test_sentinel_observation_web.py"
      - "deploy/sentinel/open-report.*"
      - "pyproject.toml"
      - ".github/workflows/sentinel-research-report.yml"
  push:
    branches: [main]
    paths:
      - "src/dx27/adapters/sentinel/**"
      - "deploy/sentinel/open-report.*"
      - "pyproject.toml"
      - ".github/workflows/sentinel-research-report.yml"

permissions:
  contents: read

jobs:
  final-report:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test,research-report]"
      - name: Validate packaged PDF and OCR runtime
        run: python -c "from dx27.adapters.sentinel.research_service import validate_research_dependencies; validate_research_dependencies()"
      - name: Offline report, persistence, parsing and loopback tests
        run: >-
          python -m pytest -q
          tests/unit/test_sentinel_factset_research.py
          tests/unit/test_sentinel_yardeni_research.py
          tests/unit/test_sentinel_research_analysis.py
          tests/unit/test_sentinel_research_service.py
          tests/unit/test_sentinel_research_rendering.py
          tests/unit/test_sentinel_observation_web.py
      - name: Parse Windows PowerShell launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $Tokens = $null
          $ParseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'deploy\sentinel\open-report.ps1'),
            [ref]$Tokens, [ref]$ParseErrors
          )
          if ($ParseErrors.Count -gt 0) {
            $ParseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
