name: Selected basket risk budget
on:
  pull_request:
    paths: ['research/sector-risk/**', 'docs/research/sector-risk/**', '.github/workflows/sector-risk.yml']
  push:
    branches: [main]
    paths: ['research/sector-risk/**', 'docs/research/sector-risk/**', '.github/workflows/sector-risk.yml']
permissions:
  contents: read
jobs:
  risk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s research/sector-risk -p "test_*.py" -v
      - run: python -m unittest discover -s research/sector-momentum -p "test_*.py" -v
      - run: python -m unittest discover -s research/sector-action-review -p "test_*.py" -v
