name: Intraday replay and ledger

on:
  pull_request:
    paths:
      - "src/dx27/application/**"
      - "src/dx27/adapters/intraday/**"
      - "src/dx27/adapters/alpaca/**"
      - "src/dx27/adapters/simulated/**"
      - "src/dx27/adapters/calendars/**"
      - "src/dx27/core/**"
      - "src/dx27/domains/intraday/**"
      - "tests/unit/test_intraday*"
      - "tests/unit/test_alpaca_paper_probe.py"
      - "tests/unit/test_streaming_breakout.py"
      - "tests/unit/test_simulated_execution.py"
      - "tests/integration/test_intraday*"
      - "pyproject.toml"
      - ".github/workflows/intraday-replay.yml"
  push:
    branches: [main]
    paths:
      - "src/dx27/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/intraday-replay.yml"

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - name: Validate read-only paper HTTP boundaries
        run: >-
          python -m pytest -q
          tests/unit/test_alpaca_paper_probe.py
          tests/integration/test_intraday_paper_recorder.py
      - name: Validate baseline, causality, costs, calendars and ledgers
        run: >-
          python -m pytest -q
          tests/unit/test_intraday_data.py
          tests/unit/test_intraday_account_probe.py
          tests/unit/test_intraday_opening_volume.py
          tests/unit/test_streaming_breakout.py
          tests/unit/test_simulated_execution.py
          tests/unit/test_historical_replay.py
          tests/unit/test_intraday_breakout_bot.py
          tests/unit/test_intraday_breakout_features.py
          tests/unit/test_trade_manager.py
          tests/unit/test_target_to_intent.py
          tests/integration/test_intraday_breakout_flow.py
          tests/integration/test_intraday_ledger.py
          tests/integration/test_intraday_volume_selection.py
          tests/integration/test_intraday_recorded_shadow.py
          tests/integration/test_intraday_order_lifecycle.py
          tests/integration/test_intraday_execution_conformance.py
          tests/integration/test_intraday_closed_loop.py
          tests/integration/test_intraday_runner.py
          tests/integration/test_intraday_market_ingress.py
          tests/integration/test_intraday_incremental_shadow.py
          tests/integration/test_intraday_paper_contract.py
          tests/integration/test_intraday_paper_evidence.py
      - name: Run labeled synthetic demo
        run: python -m dx27.adapters.intraday.cli demo --output work/intra-1a-demo
      - name: Record and replay historical shadow journal without credentials
        run: >-
          python -m dx27.adapters.intraday.recorded_shadow
          --input work/intra-1a-demo/synthetic-minute-bars.csv
          --journal work/intra-1a-demo/shadow.sqlite3
          --output work/intra-1a-demo/shadow-report
      - name: Validate offline order lifecycle and historical partial-fill trace
        run: >-
          python -m dx27.adapters.intraday.execution_conformance
          --source-journal work/intra-1a-demo/shadow.sqlite3
          --output work/intra-1a-demo/lifecycle-report
      - name: Run historical closed loop with delayed partial fills
        run: >-
          python -m dx27.adapters.intraday.closed_loop
          --input work/intra-1a-demo/synthetic-minute-bars.csv
          --journal work/intra-1a-demo/closed-loop.sqlite3
          --profile examples/intraday/p2h2-partial-delayed.json
          --output work/intra-1a-demo/closed-loop-report
      - name: Validate managed historical runner preflight
        run: >-
          python -m dx27.adapters.intraday.runner preflight
          --input work/intra-1a-demo/synthetic-minute-bars.csv
          --journal work/intra-1a-demo/closed-loop.sqlite3
          --run-directory work/intra-1a-demo/runtime
          --profile examples/intraday/p2h2-partial-delayed.json
      - name: Verify completed journal through managed runner
        run: >-
          python -m dx27.adapters.intraday.runner run
          --input work/intra-1a-demo/synthetic-minute-bars.csv
          --journal work/intra-1a-demo/closed-loop.sqlite3
          --run-directory work/intra-1a-demo/runtime
          --profile examples/intraday/p2h2-partial-delayed.json
      - name: Read final runner health without credentials
        run: >-
          python -m dx27.adapters.intraday.runner status
          --run-directory work/intra-1a-demo/runtime
      - name: Convert synthetic closed-bar event trace
        run: >-
          python -m dx27.adapters.intraday.market_ingress convert
          --input work/intra-1a-demo/synthetic-minute-bars.csv
          --output work/intra-1a-demo/events.jsonl
      - name: Inspect declared event cutoffs and quality
        run: >-
          python -m dx27.adapters.intraday.market_ingress inspect
          --input work/intra-1a-demo/synthetic-minute-bars.csv
          --events work/intra-1a-demo/events.jsonl
      - name: Run supervised historical event feedback
        run: >-
          python -m dx27.adapters.intraday.runner run
          --input work/intra-1a-demo/synthetic-minute-bars.csv
          --events work/intra-1a-demo/events.jsonl
          --journal work/intra-1a-demo/event-loop.sqlite3
          --run-directory work/intra-1a-demo/event-runtime
          --profile examples/intraday/p2h2-partial-delayed.json
          --output work/intra-1a-demo/event-report
      - name: Run bounded incremental historical shadow
        run: >-
          python -m dx27.adapters.intraday.incremental_shadow run
          --input work/intra-1a-demo/synthetic-minute-bars.csv
          --events work/intra-1a-demo/events.jsonl
          --journal work/intra-1a-demo/incremental.sqlite3
          --run-directory work/intra-1a-demo/incremental-runtime
          --queue-capacity 2
          --profile examples/intraday/p2h2-partial-delayed.json
          --output work/intra-1a-demo/incremental-report
      - name: Verify completed incremental shadow without reparsing events
        run: >-
          python -m dx27.adapters.intraday.incremental_shadow run
          --input work/intra-1a-demo/synthetic-minute-bars.csv
          --events work/intra-1a-demo/events.jsonl
          --journal work/intra-1a-demo/incremental.sqlite3
          --run-directory work/intra-1a-demo/incremental-runtime
          --queue-capacity 2
          --profile examples/intraday/p2h2-partial-delayed.json
      - uses: actions/upload-artifact@v4
        with:
          name: intra-1a-synthetic-${{ matrix.os }}
          path: |
            work/intra-1a-demo/report
            work/intra-1a-demo/shadow-report
            work/intra-1a-demo/lifecycle-report/acceptance.json
            work/intra-1a-demo/lifecycle-report/report.md
            work/intra-1a-demo/closed-loop-report
            work/intra-1a-demo/runtime/health.json
            work/intra-1a-demo/event-report
            work/intra-1a-demo/event-runtime/health.json
            work/intra-1a-demo/incremental-report
            work/intra-1a-demo/incremental-runtime/health.json
