name: ORB reference contrasts
on:
  pull_request:
    paths:
      - 'research/orb-reference-contrasts/**'
      - '.github/workflows/orb-reference-contrasts.yml'
  push:
    branches: [main]
    paths:
      - 'research/orb-reference-contrasts/**'
      - '.github/workflows/orb-reference-contrasts.yml'
permissions:
  contents: read
jobs:
  contrasts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q research/orb-reference-contrasts/test_contrasts.py tests/unit/test_intraday_opening_direction_research.py
