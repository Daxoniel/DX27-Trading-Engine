name: Residual daily local commit
on:
  pull_request:
    paths: ['research/residual-daily-commit/**', 'docs/research/residual-daily-commit/**', '.github/workflows/residual-daily-commit.yml']
  push:
    branches: [main]
    paths: ['research/residual-daily-commit/**', 'docs/research/residual-daily-commit/**', '.github/workflows/residual-daily-commit.yml']
permissions:
  contents: read
jobs:
  admission:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve sealed LF source bytes
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install exchange_calendars==4.13.2
      - run: python -m unittest discover -s research/residual-daily-commit -p "test_*.py" -v
      - run: python -m unittest discover -s research/residual-daily-admission -p "test_*.py" -v
      - run: python -m unittest discover -s research/residual-daily -p "test_*.py" -v
      - run: python -m unittest discover -s research/residual-alias-admission -p "test_*.py" -v
      - run: python -m unittest discover -s research/residual-capture -p "test_*.py" -v
      - run: python -m unittest discover -s research/residual-integration -p "test_*.py" -v
      - run: python -m unittest discover -s research/residual-admission -p "test_*.py" -v
      - run: python -m unittest discover -s research/residual-shadow -p "test_*.py" -v
      - run: python -m unittest discover -s research/residual-forward -p "test_*.py" -v
      - run: python -m unittest discover -s research/residual-validation -p "test_*.py" -v
      - run: python -m unittest discover -s research/residual-momentum -p "test_*.py" -v
      - run: python -m unittest discover -s research/sector-momentum -p "test_*.py" -v
      - working-directory: research/residual-daily-commit
        run: python -c "from guard import verify_code; verify_code()"
