[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dx27-trading-engine"
version = "0.1.0"
description = "DX27 modular trading engine"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.40",
    "exchange-calendars==4.13.2",
    "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pypdf>=5,<7"]
forecast = ["chronos-forecasting==2.3.2", "transformers==4.57.1", "torch>=2.2,<3"]
research-report = ["pypdf>=5,<7", "rapidocr-onnxruntime>=1.4,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not network'"
markers = [
    "integration: test crosses a DX27 component boundary",
    "network: test requires an external network service and is excluded by default",
]
